name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# AUDIT: least privilege for every job (the default GITHUB_TOKEN can be read/write).
permissions:
  contents: read

jobs:
  backend:
    name: Rust Backend Tests
    runs-on: ubuntu-latest
    # Postgres for the native-games integration tests (they skip themselves without DATABASE_URL).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kaspabattle -> target
      - name: Check formatting
        working-directory: ./kaspabattle
        run: cargo fmt --all -- --check
      - name: Run Tests
        working-directory: ./kaspabattle
        run: cargo test --workspace --all-features
      - name: Run Clippy
        working-directory: ./kaspabattle
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 20 reached end-of-life in April 2026
      - name: Install dependencies
        working-directory: ./battle-frontend
        run: npm ci
      - name: Lint
        working-directory: ./battle-frontend
        run: npm run lint
      - name: Test
        working-directory: ./battle-frontend
        run: npm run test

  frontend-image:
    name: Frontend Docker image (prod target builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only (no push): catches Dockerfile/lockfile drift such as `npm ci` failures
      # that the plain `npm run build` job cannot see.
      - name: Build prod image
        run: docker build -f battle-frontend/Dockerfile --target prod -t kaspabattle-frontend:ci .
      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
        # `env_file: .env.production` is deliberately untracked, so create an empty stand-in.
        run: |
          touch .env.production
          docker compose config --quiet

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the secret scan can see past commits

      # ── Rust dependency audit ──
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Cargo Audit
        working-directory: ./kaspabattle
        run: cargo audit
        continue-on-error: true  # Advisory-only for now; promote to hard-fail for Beta

      # ── Node dependency audit ──
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 20 reached end-of-life in April 2026
      - name: Install frontend deps
        working-directory: ./battle-frontend
        run: npm ci
      - name: NPM Audit
        working-directory: ./battle-frontend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      # ── Secret Scan ──
      - name: Secret Scan (TruffleHog)
        # Pinned to a release commit (was the moving `main` branch).
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --only-verified
        continue-on-error: true
