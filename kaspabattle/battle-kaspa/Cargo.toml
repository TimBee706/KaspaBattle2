[package]
name = "battle-kaspa"
version = "0.2.0"
edition = "2021"

[dependencies]
battle-core = { path = "../battle-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Kaspa ecosystem (v0.15)
kaspa-wrpc-client = "0.15"
kaspa-rpc-core = "0.15"
kaspa-wallet-keys = "0.15"
kaspa-bip32 = "0.15"
kaspa-addresses = "0.15"
kaspa-consensus-core = "0.15"
kaspa-txscript = "0.15"
kaspa-hashes = "0.15"

# Cryptography
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
