[package]
name = "battle-kdapp"
version = "0.1.0"
edition = "2021"
description = "KaspaBattle kdapp/Resolver integration — Episode-based on-chain match logic"

[dependencies]
battle-core = { path = "../battle-core" }

# Kaspa ecosystem — use same versions as battle-kaspa (v0.15) to avoid conflicts.
# The kdapp framework code is inlined into this crate (episode, engine, generator, etc.)
# to avoid transitive dependency conflicts with rusty-kaspa v1.0.0.
kaspa-addresses = "0.15"
kaspa-wrpc-client = "0.15"
kaspa-rpc-core = "0.15"
kaspa-consensus-core = "0.15"
kaspa-hashes = "0.15"
kaspa-txscript = "0.15"

# Serialization (matching kdapp's borsh version)
borsh = { version = "1", features = ["derive", "rc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (same versions as battle-api for workspace compat)
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "uuid",
    "chrono",
] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Crypto (same as kdapp)
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
sha2 = "0.10"
rand = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
log = "0.4"
env_logger = "0.11"
thiserror = "1"

# Match wasm-bindgen pinning from battle-kaspa to avoid workspace conflicts
wasm-bindgen = "=0.2.95"
js-sys = "=0.3.72"
web-sys = "=0.3.72"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
