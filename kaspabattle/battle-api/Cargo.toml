[package]
name = "battle-api"
version = "0.1.0"
edition = "2021"
default-run = "battle-api"

[dependencies]
battle-core = { path = "../battle-core" }
battle-kaspa = { path = "../battle-kaspa" }
battle-kdapp = { path = "../battle-kdapp" }
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
# Rate-limiting via governor crate (compatible with axum 0.7)
governor = "0.6"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "uuid",
    "chrono",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
sha2 = "0.10"
hex = "0.4"
kaspa-addresses = "0.15"
kaspa-hashes = "0.15"
async-trait = "0.1"
urlencoding = "2.1"
ed25519-dalek = "2"
rand = "0.8"
secp256k1 = { version = "0.29", features = ["global-context"] }
# F-007: Constant-time comparison for Oracle key auth
subtle = "2"
# M-03/M-04: HMAC-SHA256 for webhook signature verification and admin key comparison
hmac = "0.12"
# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
wiremock = "0.6"
# Drives the real axum router in the native-games integration tests.
tower = { version = "0.5", features = ["util"] }
