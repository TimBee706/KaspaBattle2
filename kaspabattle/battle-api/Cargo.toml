[package]
name = "battle-api"
version = "0.1.0"
edition = "2021"

[dependencies]
battle-core = { path = "../battle-core" }
battle-kaspa = { path = "../battle-kaspa" }
actix-web = "4"
actix-cors = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "uuid",
    "chrono",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
urlencoding = "2.1"
ed25519-dalek = "2"
rand = "0.8"
# F-006: Rate limiting middleware
actix-governor = "0.6"
# F-007: Constant-time comparison for Oracle key auth
subtle = "2"

[dev-dependencies]
wiremock = "0.6"
