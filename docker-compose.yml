services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kaspabattle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run init SQL on first start
      - ./kaspabattle/migrations/202602280000_init_pg.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./kaspabattle/migrations/202603010000_add_escrow_address.sql:/docker-entrypoint-initdb.d/02_escrow.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d kaspabattle" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Kaspa Node (Testnet-10) ─────────────────────────────────────────────────
  kaspa-node:
    image: kaspanet/rusty-kaspad:latest
    restart: unless-stopped
    user: "0:0"
    ports:
      - "16110:16110" # P2P
      - "16111:16111" # wRPC (WebSocket-RPC)
    volumes:
      - kaspa-data:/home/kaspa/.rusty-kaspa
    command: >
      /app/kaspad --utxoindex --testnet --rpclisten=0.0.0.0:16110 --rpclisten-borsh=0.0.0.0:16111 --disable-upnp
    healthcheck:
      test: [ "CMD-SHELL", "ps | grep '[k]aspad' >/dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ── Rust Backend (battle-api) ────────────────────────────────────────────────
  backend:
    build:
      context: ./kaspabattle
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    environment:
      # Override to use Docker service names instead of localhost
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/kaspabattle
      KASPA_NODE_URL: ws://kaspa-node:16111
    depends_on:
      postgres:
        condition: service_healthy
      kaspa-node:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:8080/api/v1/lobbies || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── Vite / React Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: battle-frontend/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
      VITE_WS_BASE_URL: ws://localhost:8080/ws
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
    name: kaspabattle_pgdata
  kaspa-data:
    name: kaspabattle_kaspa_data

networks:
  default:
    name: kaspabattle_net
