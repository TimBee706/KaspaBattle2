# Bound container logs: the default json-file driver is unbounded and can fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaspabattle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-kaspabattle}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run init SQL on first start
      - ./kaspabattle/migrations/202602280000_init_pg.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./kaspabattle/migrations/202603010000_add_escrow_address.sql:/docker-entrypoint-initdb.d/02_escrow.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d kaspabattle" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Kaspa Node (Testnet-10) ── DISABLED (uses public resolver instead) ───────
  # kaspa-node:
  #   image: kaspanet/rusty-kaspad:latest
  #   restart: unless-stopped
  #   user: "0:0"
  #   ports:
  #     - "16110:16110" # P2P
  #     - "16111:16111" # wRPC (WebSocket-RPC)
  #   volumes:
  #     - kaspa-data:/home/kaspa/.rusty-kaspa
  #   command: >
  #     /app/kaspad --utxoindex --testnet --rpclisten=0.0.0.0:16110 --rpclisten-borsh=0.0.0.0:16111 --disable-upnp
  #   healthcheck:
  #     test: [ "CMD-SHELL", "ps | grep '[k]aspad' >/dev/null || exit 1" ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 120s

  # ── Rust Backend (battle-api) ────────────────────────────────────────────────
  backend:
    build:
      context: ./kaspabattle
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Loopback only: production traffic reaches the backend through Caddy over the compose
    # network (backend:8080). Docker-published ports bypass host firewalls such as ufw, so
    # "0.0.0.0:8080" would expose the plain-HTTP API to the internet.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.production
    environment:
      # Override to use Docker service names instead of localhost.
      # All Kaspa RPC settings (KASPA_NODE_URL, KASPA_USE_EXPLICIT_NODE, KASPA_NETWORK)
      # come exclusively from .env.production — no node/IP is hardcoded here.
      # Without an explicit node, battle-api falls back to the public Kaspa Resolver.
      DATABASE_URL: postgres://${POSTGRES_USER:-kaspabattle}:${POSTGRES_PASSWORD:?Database password required}@postgres:5432/${POSTGRES_DB:-kaspabattle}
    depends_on:
      postgres:
        condition: service_healthy
      # kaspa-node:  # disabled
      #   condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:8080/api/v1/lobbies || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── Vite / React Frontend ───────────────────────────────────────────────────
  # build.target defaults to "dev" (Vite dev server) for local testing.
  # Set FRONTEND_BUILD_TARGET=prod in .env for a real deployment (optimized
  # static build served via `serve` instead of the Vite dev server).
  frontend:
    build:
      context: .
      dockerfile: battle-frontend/Dockerfile
      target: ${FRONTEND_BUILD_TARGET:-dev}
      # Only consumed by the "prod" target's `npm run build` step — Vite bakes
      # VITE_* into the static bundle at build time, so runtime `environment:`
      # below is not enough for target=prod (it IS enough for target=dev, where
      # the Vite dev server reads them live). Same values, kept in sync.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8080/ws}
        VITE_KASPA_NETWORK: ${KASPA_NETWORK:-testnet-10}
        VITE_KASPA_NODE_URL: ${VITE_KASPA_NODE_URL:-}
        # Public support/contact address shown on the landing page footer —
        # never a private address, see battle-frontend/.env.example.
        VITE_PUBLIC_CONTACT_EMAIL: ${VITE_PUBLIC_CONTACT_EMAIL:-}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Loopback only (see backend): the Vite dev server must never be internet-facing.
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      # Local-dev-friendly defaults; override in .env/.env.production for a real domain.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8080/ws}
      VITE_KASPA_NETWORK: ${KASPA_NETWORK:-testnet-10}
      # Only relevant if the browser talks to the Kaspa node directly through the
      # Caddy proxy (see Caddyfile.example, /kaspa-rpc). Leave unset to have the
      # frontend rely on the backend for all Kaspa RPC instead.
      VITE_KASPA_NODE_URL: ${VITE_KASPA_NODE_URL:-}
      VITE_PUBLIC_CONTACT_EMAIL: ${VITE_PUBLIC_CONTACT_EMAIL:-}
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Caddy Reverse Proxy (production only) ───────────────────────────────────
  # Not started by a plain `docker-compose up` — needs a real domain + Caddyfile.
  # Enable explicitly for IONOS/production: `docker-compose --profile proxy up -d`
  # Setup: cp Caddyfile.example Caddyfile, then set DOMAIN/TLS_EMAIL in .env.
  # (DOMAIN/TLS_EMAIL default to empty here — not `:?required` — so a profile-less
  # `docker-compose up` for local testing never fails config parsing because of
  # this service; Caddy itself will error clearly at container start if this
  # profile is enabled without setting them.)
  caddy:
    image: caddy:2.7-alpine
    restart: unless-stopped
    logging: *default-logging
    profiles: ["proxy"]
    # No `no-new-privileges` here on purpose: the Caddy image binds :80/:443 via a file
    # capability (cap_net_bind_service), which that option would disable.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    environment:
      # Read by Caddyfile via {$DOMAIN} / {$TLS_EMAIL} / {$KASPA_RPC_HTTP_TARGET}.
      DOMAIN: ${DOMAIN:-}
      TLS_EMAIL: ${TLS_EMAIL:-}
      # Optional: only needed if the browser talks to the Kaspa node directly
      # through Caddy (mixed-content workaround for ws:// nodes behind https://).
      KASPA_RPC_HTTP_TARGET: ${KASPA_RPC_HTTP_TARGET:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
    name: kaspabattle_pgdata
  kaspa-data:
    name: kaspabattle_kaspa_data
  caddy_data:
    name: kaspabattle_caddy_data
  caddy_config:
    name: kaspabattle_caddy_config

networks:
  default:
    name: kaspabattle_net
